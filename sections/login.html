<div id="login-view" class="flex items-center justify-center p-6 bg-[#110c06] min-h-[80vh]">
    <div class="glass-panel w-full max-w-sm p-10 rounded-[30px] border-t border-white/20 text-center animate-pop-in relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-400 via-yellow-200 to-orange-400 opacity-60"></div>
        <h1 class="text-6xl font-extrabold tracking-tighter mb-2 bg-clip-text text-transparent bg-gradient-to-br from-amber-200 via-yellow-400 to-orange-400">FinCaL</h1>
        <p class="text-xs uppercase tracking-[0.4em] text-gray-500 mb-10">Financial Operating System</p>

        <div id="login-register" class="view-hidden space-y-6">
            <input type="text" id="regName" placeholder="USERNAME" class="input-glow w-full p-4 rounded-2xl uppercase tracking-widest text-sm">
            <input type="number" id="regPin" inputmode="numeric" placeholder="SET PIN (4)" class="input-glow w-full p-4 rounded-2xl font-mono text-2xl tracking-[0.5em]" oninput="if(this.value.length>4) this.value=this.value.slice(0,4)">
            <button onclick="registerUser()" class="w-full bg-white text-black font-bold py-4 rounded-2xl shadow-[0_0_30px_rgba(255,255,255,0.2)] mt-2 hover:scale-[1.02] transition-transform text-sm tracking-widest uppercase">Initialize Account</button>
            <button onclick="showLogin()" class="text-[11px] text-gray-500 hover:text-white uppercase tracking-widest mt-4">Cancel</button>
        </div>

        <div id="login-auth" class="view-hidden space-y-6">
            <div class="mb-8">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-amber-950 to-stone-900 border border-amber-700/20 mx-auto flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(245,166,35,0.1)]">
                    <i class="fa-solid fa-fingerprint text-4xl text-amber-800"></i>
                </div>
                <p class="text-xs text-gray-500 uppercase tracking-widest mb-3">Select Identity</p>
                <select id="userSelect" class="input-glow w-full p-3 rounded-xl text-base font-bold uppercase tracking-wider bg-black"></select>
            </div>
            <input type="password" id="authPin" inputmode="numeric" placeholder="• • • •" class="input-glow w-full p-4 rounded-2xl font-mono text-3xl tracking-[0.5em] text-amber-400" oninput="if(this.value.length>4) this.value=this.value.slice(0,4)">
            <button onclick="authenticateUser()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-black font-bold py-4 rounded-2xl shadow-[0_0_25px_rgba(245,166,35,0.3)] mt-4 hover:scale-[1.02] transition-transform text-sm tracking-widest uppercase">Unlock Dashboard</button>
            <div class="flex justify-between mt-8 px-2">
                <button onclick="showRegister()" class="text-[10px] text-amber-700 hover:text-amber-400 transition-colors uppercase tracking-widest">+ Create Account</button>
                <button onclick="resetSystem()" class="text-[10px] text-amber-900 hover:text-red-500 transition-colors uppercase tracking-widest">System Reset</button>
            </div>
        </div>
    </div>
</div>
