<div id="tab-expenses-content" class="flex flex-col gap-8 animate-pop-in">
    <!-- Doughnut & Monthly Balance Floating Glass Card -->
    <div class="glass-card-floating p-6 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500 blur-[90px] opacity-15"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-orange-600 blur-[90px] opacity-10"></div>
        <div class="relative z-10 grid grid-cols-2 gap-4 items-center">
            <div class="relative w-40 h-40 mx-auto">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="ring-progress" class="circle" stroke="#f5a623" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <span class="text-[11px] text-gray-400 uppercase tracking-widest font-mono mb-1 flex items-center justify-center gap-1">
                        <i data-lucide="wallet" class="w-3.5 h-3.5 text-amber-400"></i> Balance
                    </span>
                    <span class="text-2xl font-bold font-mono text-white tracking-tight">₹<span id="displayBalance">0.00</span></span>
                </div>
            </div>
            <div class="text-right space-y-5">
                <div>
                    <p class="text-[11px] text-gray-400 uppercase tracking-widest font-mono mb-1 flex items-center justify-end gap-1">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-amber-400"></i> Monthly Limit
                    </p>
                    <div class="flex justify-end items-center gap-2">
                        <span class="text-gray-400 text-base font-mono">₹</span>
                        <input type="number" id="budgetInput" step="0.01" onchange="setBudget()" placeholder="0.00" class="bg-transparent border-b border-amber-900 w-24 text-right text-amber-100 font-mono text-xl focus:outline-none focus:border-amber-400 transition-colors">
                    </div>
                </div>
                <div>
                    <p class="text-[11px] text-gray-400 uppercase tracking-widest font-mono mb-1 flex items-center justify-end gap-1">
                        <i data-lucide="trending-down" class="w-3.5 h-3.5 text-red-400"></i> Total Spent
                    </p>
                    <p class="text-xl font-mono text-red-400 font-bold drop-shadow-[0_0_12px_rgba(255,50,50,0.5)]">₹<span id="displaySpent">0.00</span></p>
                    <button onclick="showBudgetHistory()" class="text-[10px] text-neonBlue hover:text-white underline uppercase tracking-widest mt-1 font-mono flex items-center justify-end gap-1 ml-auto">
                        <i data-lucide="bar-chart-3" class="w-3 h-3"></i> View Analytics
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Add Expense Form Card -->
    <div class="glass-card-floating p-1 relative overflow-hidden group">
        <div class="bg-black/30 rounded-[28px] p-6 text-center">
            <div class="flex flex-col gap-4">
                <div class="relative flex items-center">
                    <i data-lucide="tag" class="w-4 h-4 absolute left-5 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="expenseName" placeholder="Expense Name..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white text-base focus:outline-none focus:border-neonGreen focus:bg-white/10 transition-all placeholder-gray-500">
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <div class="col-span-3 relative flex items-center">
                        <i data-lucide="indian-rupee" class="w-5 h-5 absolute left-5 top-1/2 -translate-y-1/2 text-neonGreen"></i>
                        <input type="number" id="expenseAmount" step="0.01" placeholder="0.00" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white font-mono text-xl focus:outline-none focus:border-neonGreen focus:bg-white/10 transition-all">
                    </div>
                    <button onclick="addExpense()" title="Add Expense" class="col-span-1 bg-neonGreen text-black font-bold rounded-2xl flex items-center justify-center hover:bg-white transition-all shadow-[0_0_20px_rgba(0,255,157,0.4)] hover:scale-[1.03]">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Transactions Section -->
    <div>
        <div class="flex flex-col gap-4 px-4 mb-3">
            <div class="flex flex-col gap-3">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-[0.2em] font-mono">Transaction Log</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <button onclick="showMonthlyStats()" class="text-[10px] text-neonPurple/80 hover:text-neonPurple uppercase tracking-widest border border-neonPurple/30 px-3 py-2 rounded-xl truncate font-mono bg-white/5 hover:bg-white/10 transition-all flex items-center justify-center gap-1.5"><i data-lucide="pie-chart" class="w-3.5 h-3.5"></i> Monthly</button>
                    <button onclick="showHistory()" class="text-[10px] text-neonGreen/80 hover:text-neonGreen uppercase tracking-widest border border-neonGreen/30 px-3 py-2 rounded-xl truncate font-mono bg-white/5 hover:bg-white/10 transition-all flex items-center justify-center gap-1.5"><i data-lucide="history" class="w-3.5 h-3.5"></i> History</button>
                    <button onclick="exportCSV()" class="text-[10px] text-neonBlue/80 hover:text-neonBlue uppercase tracking-widest border border-neonBlue/30 px-3 py-2 rounded-xl truncate font-mono bg-white/5 hover:bg-white/10 transition-all flex items-center justify-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Export</button>
                    <button onclick="resetExpenses()" class="text-[10px] text-red-500/80 hover:text-red-400 uppercase tracking-widest border border-red-500/30 px-3 py-2 rounded-xl truncate font-mono bg-white/5 hover:bg-white/10 transition-all flex items-center justify-center gap-1.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear</button>
                </div>
            </div>
            <div class="flex gap-2 w-full">
                <div class="relative flex-1 flex items-center">
                    <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="expenseSearch" oninput="filterExpenses()" placeholder="SEARCH BY NAME OR DATE..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-11 pr-4 text-xs text-white uppercase tracking-widest focus:outline-none focus:border-neonBlue transition-all">
                </div>
                <div class="relative flex items-center">
                    <i data-lucide="arrow-down-up" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-amber-400 pointer-events-none"></i>
                    <select id="selectExpensesSort" onchange="changeExpensesSortOrder(this.value)" class="pl-9 pr-3 py-3 rounded-2xl bg-black border border-white/10 text-xs text-amber-100 uppercase tracking-wider focus:outline-none font-mono">
                        <option value="date-desc" class="bg-black">Newest</option>
                        <option value="date-asc" class="bg-black">Oldest</option>
                        <option value="amount-desc" class="bg-black">Price High-Low</option>
                        <option value="amount-asc" class="bg-black">Price Low-High</option>
                        <option value="name-asc" class="bg-black">Name (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="glass-card-floating overflow-hidden min-h-[300px]">
            <div id="expenseList" class="divide-y divide-white/5"></div>
            <div id="showMoreContainer" class="hidden p-4 text-center border-t border-white/5">
                <button onclick="toggleShowAllExpenses()" id="btnShowMore" class="text-[10px] text-neonBlue font-bold uppercase tracking-[0.2em] hover:text-white transition-colors">Show More</button>
            </div>
            <div id="emptyState" class="hidden py-20 text-center">
                <i class="fa-solid fa-box-open text-5xl text-gray-700 mb-3"></i>
                <p class="text-xs text-gray-500 uppercase tracking-widest font-mono">No Recent Data</p>
            </div>
        </div>
    </div>
</div>
